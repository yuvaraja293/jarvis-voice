<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JARVIS Voice Bridge</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(500px, 90%);
      text-align: center;
      background: #111722;
      border: 1px solid #202838;
      border-radius: 20px;
      padding: 30px;
    }

    h1 {
      letter-spacing: 2px;
    }

    button {
      width: 100%;
      min-height: 65px;
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      background: #1d8f69;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button.listening {
      background: #8b2020;
    }

    .status {
      margin-top: 20px;
      color: #8d98aa;
      min-height: 24px;
    }

    .heard {
      margin-top: 15px;
      padding: 15px;
      background: #080d16;
      border-radius: 12px;
      min-height: 25px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🤖 JARVIS</h1>

  <div>Voice Bridge</div>

  <button id="talkButton">
    🎙️ TALK TO JARVIS
  </button>

  <div id="status" class="status">
    Voice bridge ready
  </div>

  <div id="heard" class="heard">
    Waiting for voice command...
  </div>

</div>

<script>

let recognition = null;
let listening = false;

const button = document.getElementById("talkButton");
const status = document.getElementById("status");
const heard = document.getElementById("heard");

button.addEventListener("click", startVoice);

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    status.innerText =
      "Speech recognition is not supported by this browser.";
    return;
  }

  if (listening) {
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  listening = true;

  button.classList.add("listening");
  button.innerText = "🔴 LISTENING...";
  status.innerText = "I'm listening...";

  recognition.onresult = function(event) {

    const transcript =
      event.results[0][0].transcript.trim();

    heard.innerText = transcript;
    status.innerText = "Command captured.";

    if (window.opener) {

      window.opener.postMessage(
        {
          type: "JARVIS_VOICE_COMMAND",
          text: transcript
        },
        "https://script.google.com"
      );

    } else {

      status.innerText =
        "JARVIS window was not found.";

    }
  };

  recognition.onerror = function(event) {

    status.innerText =
      "Voice error: " + event.error;

    resetVoiceButton();
  };

  recognition.onend = function() {

    resetVoiceButton();

  };

  try {

    recognition.start();

  } catch (error) {

    status.innerText =
      "Could not start voice recognition.";

    resetVoiceButton();

  }
}

function resetVoiceButton() {

  listening = false;

  button.classList.remove("listening");

  button.innerText =
    "🎙️ TALK TO JARVIS";
}

window.addEventListener("load", function() {

  setTimeout(function() {

    startVoice();

  }, 300);

});

</script>

</body>
</html>
